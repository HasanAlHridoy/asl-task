name: asl_task
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"
dependencies:
  connectivity_plus: ^6.1.1
  flutter:
    sdk: flutter
  flutter_easyloading: ^3.0.5
  flutter_web_plugins:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_riverpod: ^2.6.1
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.16
  go_router: ^14.6.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  file_picker: ^9.2.1
  syncfusion_flutter_charts: ^29.1.41
  dio: ^5.8.0+1
  flutter_screenutil: ^5.9.3
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  cached_network_image: ^3.4.1
  mime: ^2.0.0
  fluttertoast: ^8.2.12
  device_preview: ^1.3.1

dev_dependencies:
  build_runner: ^2.4.14
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  rename_app: ^1.6.2


# flutter_native_splash:
#   color: "#ffffff"
