  # command: dart run flutter_native_splash:create

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/icons/
    - assets/images/
    - assets/svgs/
    - assets/flags/

  fonts:
    - family: Fustat
      fonts:
        - asset: assets/fonts/fustat-latin-200-normal.ttf
          weight: 200
        - asset: assets/fonts/fustat-latin-300-normal.ttf
          weight: 300
        - asset: assets/fonts/fustat-latin-400-normal.ttf
          weight: 400
        - asset: assets/fonts/fustat-latin-500-normal.ttf
          weight: 500
        - asset: assets/fonts/fustat-latin-600-normal.ttf
          weight: 600
        - asset: assets/fonts/fustat-latin-700-normal.ttf
          weight: 700
        - asset: assets/fonts/fustat-latin-800-normal.ttf
          weight: 800

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package